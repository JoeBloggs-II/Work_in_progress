<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>CPU 3D Engine</title>
<style>
  body { margin:0; background:black; overflow:hidden; color:white; font-family:sans-serif; }
  canvas { display:block; }
  #ui { position:absolute; top:10px; left:10px; pointer-events:none; }
</style>
</head>
<body>
<div id="ui">WASD move | Space jump | Arrow look</div>
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

const W = canvas.width;
const H = canvas.height;

let img = ctx.createImageData(W, H);
let depth = new Float32Array(W * H);

// =====================
// Math
// =====================
function vec3(x,y,z){return {x,y,z};}
function add(a,b){return vec3(a.x+b.x,a.y+b.y,a.z+b.z);}
function sub(a,b){return vec3(a.x-b.x,a.y-b.y,a.z-b.z);}
function dot(a,b){return a.x*b.x+a.y*b.y+a.z*b.z;}
function cross(a,b){
  return vec3(
    a.y*b.z-a.z*b.y,
    a.z*b.x-a.x*b.z,
    a.x*b.y-a.y*b.x
  );
}
function norm(v){
  let l=Math.hypot(v.x,v.y,v.z);
  return l===0?vec3(0,0,0):vec3(v.x/l,v.y/l,v.z/l);
}

// =====================
// Camera
// =====================
let camPos = vec3(0,0,-3);
let camYaw = 0;
let camPitch = 0;

let velY = 0;
let jumping = false;

const GRAVITY = -12;
const JUMP = 14;
const GROUND = 0;

const keys = {};
addEventListener("keydown",e=>keys[e.key.toLowerCase()]=true);
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

// =====================
// Projection
// =====================
const fov = 180;
const aspect = W/H;
const f = 1/Math.tan((fov/2)*Math.PI/180);

function project(v){
  return {
    x:(v.x*f/aspect)/v.z,
    y:(v.y*f)/v.z,
    z:v.z
  };
}

function toScreen(v){
  return {
    x:(v.x+1)*0.5*W,
    y:(1-(v.y+1)*0.5)*H,
    z:v.z
  };
}

// =====================
// Geometry
// =====================
const verts = [
  vec3(-1,-1,-1), vec3(1,-1,-1),
  vec3(1,1,-1), vec3(-1,1,-1),
  vec3(-1,-1,1), vec3(1,-1,1),
  vec3(1,1,1), vec3(-1,1,1)
];

const tris = [
  [0,3,2],[0,2,1],
  [4,5,6],[4,6,7],
  [0,1,5],[0,5,4],
  [2,3,7],[2,7,6],
  [1,2,6],[1,6,5],
  [0,4,7],[0,7,3]
];

// =====================
// Lighting (CLEAN MODEL)
// =====================

// single sun direction (fixes "multiple lights" feeling)
const lightDir = norm(vec3(0.4, 1, -0.6));

function ambient(){
  return 0.55; // 🔥 raise/lower overall brightness here
}

function lambert(n){
  return Math.max(0, dot(n, lightDir));
}

// stable specular (Blinn-Phong)
function specular(n, pos){
  let viewDir = norm(sub(camPos, pos));
  let halfDir = norm(add(lightDir, viewDir));
  return Math.pow(Math.max(0, dot(n, halfDir)), 24);
}

// =====================
// Raster
// =====================
function edge(a,b,c){
  return (c.x-a.x)*(b.y-a.y)-(c.y-a.y)*(b.x-a.x);
}

function drawTri(v0,v1,v2,n0,n1,n2,color){

  let minX=Math.max(0,Math.floor(Math.min(v0.x,v1.x,v2.x)));
  let maxX=Math.min(W-1,Math.ceil(Math.max(v0.x,v1.x,v2.x)));
  let minY=Math.max(0,Math.floor(Math.min(v0.y,v1.y,v2.y)));
  let maxY=Math.min(H-1,Math.ceil(Math.max(v0.y,v1.y,v2.y)));

  let area=edge(v0,v1,v2);
  if(area===0)return;

  let r=(color>>16)&255;
  let g=(color>>8)&255;
  let b=color&255;

  for(let y=minY;y<=maxY;y++){
    for(let x=minX;x<=maxX;x++){

      let p={x,y};

      let w0=edge(v1,v2,p)/area;
      let w1=edge(v2,v0,p)/area;
      let w2=edge(v0,v1,p)/area;

      if(w0>=0&&w1>=0&&w2>=0){

        let z = w0*v0.z + w1*v1.z + w2*v2.z;
        let i = x + y*W;

        if(z < depth[i]){

          depth[i]=z;

          // interpolated normal
          let n = norm({
            x:w0*n0.x + w1*n1.x + w2*n2.x,
            y:w0*n0.y + w1*n1.y + w2*n2.y,
            z:w0*n0.z + w1*n1.z + w2*n2.z
          });

          let diff = lambert(n);
          let spec = specular(n, v0);

          // 🔥 FINAL LIGHT MODEL (balanced)
          let light =
            ambient() +
            diff * 0.85 +
            spec * 0.20;

          let idx=i*4;
          img.data[idx]=Math.min(255,r*light*2);
          img.data[idx+1]=Math.min(255,g*light*2);
          img.data[idx+2]=Math.min(255,b*light*2);
          img.data[idx+3]=255;
        }
      }
    }
  }
}

// =====================
// Rotation
// =====================
function rotY(v,a){
  return vec3(
    v.x*Math.cos(a)+v.z*Math.sin(a),
    v.y,
    -v.x*Math.sin(a)+v.z*Math.cos(a)
  );
}

function rotX(v,a){
  return vec3(
    v.x,
    v.y*Math.cos(a)+v.z*Math.sin(a),
    -v.y*Math.sin(a)+v.z*Math.cos(a)
  );
}

// =====================
// Main loop
// =====================
let last=performance.now();

function loop(){

  let now=performance.now();
  let dt=(now-last)/1000;
  last=now;

  let speed=5*dt;
  let rot=2*dt;

  let mx=0,mz=0;

  if(keys["w"])mz+=1;
  if(keys["s"])mz-=1;
  if(keys["a"])mx-=1;
  if(keys["d"])mx+=1;

  let forward=vec3(Math.sin(camYaw),0,Math.cos(camYaw));
  let right=vec3(Math.cos(camYaw),0,-Math.sin(camYaw));

  camPos.x+=(forward.x*mz+right.x*mx)*speed;
  camPos.z+=(forward.z*mz+right.z*mx)*speed;

  if(keys[" "] && !jumping){
    velY=JUMP;
    jumping=true;
  }

  velY+=GRAVITY*dt;
  camPos.y+=velY*dt;

  if(camPos.y<GROUND){
    camPos.y=GROUND;
    velY=0;
    jumping=false;
  }

  if(keys["arrowleft"])camYaw-=rot;
  if(keys["arrowright"])camYaw+=rot;

  img.data.fill(256);
  depth.fill(Infinity);

  let objects=[
    {pos:vec3(0,0,5),color:0xaa4444},
    {pos:vec3(4,0,8),color:0x44aa44}
  ];

  for(let obj of objects){

    for(let tri of tris){

      let v0=verts[tri[0]];
      let v1=verts[tri[1]];
      let v2=verts[tri[2]];

      function transform(v){
        let r=add(v,obj.pos);
        r=sub(r,camPos);
        r=rotY(r,-camYaw);
        r=rotX(r,-camPitch);
        return r;
      }

      let p0=transform(v0);
      let p1=transform(v1);
      let p2=transform(v2);

      if(p0.z<0.01||p1.z<0.01||p2.z<0.01)continue;

      let n0=norm(v0);
      let n1=norm(v1);
      let n2=norm(v2);

      let s0=toScreen(project(p0));
      let s1=toScreen(project(p1));
      let s2=toScreen(project(p2));

      drawTri(s0,s1,s2,n0,n1,n2,obj.color);
    }
  }

  ctx.putImageData(img,0,0);
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
