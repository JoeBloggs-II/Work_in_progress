<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Engine</title>
    <style>
        body {
            margin: 0;
            background-color: black;
            overflow: hidden;
            color: white;
            font-family: sans-serif;
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="ui">WASD move | Space jump | Arrow look</div>
    <canvas id="c"></canvas>

    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let img = ctx.createImageData(canvas.width, canvas.height);
        let depth = new Float32Array(canvas.width * canvas.height);

        // Define camera properties
        let camPos = vec3(0, 0, -3);
        let camYaw = 0;
        let camPitch = 0;

        let velY = 0;
        let jumping = false;

        const gravity = -12;
        const jump = 14;
        const groundZ = 0;

        const keys = {};

        // Add event listeners for keydown and keyup events
        document.addEventListener('keydown', e => keys[e.key] = true);
        document.addEventListener('keyup', e => keys[e.key] = false);

        // Calculate FOV in radians
        const fov = 90;
        const aspectRatio = canvas.width / canvas.height;
        const nearPlane = 1;
        const farPlane = 1000;
        const f = 1 / Math.tan((fov / 2) * Math.PI / 180);

        // Projective transformation matrix
        const projectionMatrix = [
            [f / aspectRatio, 0, 0, 0],
            [0, f, 0, 0],
            [0, 0, -(farPlane + nearPlane) / (nearPlane - farPlane), -(2 * nearPlane * farPlane) / (nearPlane - farPlane)],
            [0, 0, -1, 0]
        ];

        // Transformations for rotation around Y-axis
        function rotateY(angle) {
            return vec3(
                Math.cos(angle) * camPos.x - Math.sin(angle) * camPos.z,
                camPos.y,
                Math.sin(angle) * camPos.x + Math.cos(angle) * camPos.z
            );
        }

        // Transformations for rotation around X-axis
        function rotateX(angle) {
            return vec3(
                Math.cos(angle) * camPos.x,
                Math.sin(angle) * camPos.y + camPos.z * Math.cos(angle),
                -Math.sin(angle) * camPos.x + camPos.z * Math.cos(angle)
            );
        }

        // Function to convert vertex coordinates to screen space
        function toScreen(vertex) {
            return {
                x: (vertex.x + 1) * 0.5 * canvas.width,
                y: (1 - (vertex.y + 1)) * canvas.height,
                z: vertex.z
            };
        }

        // Function to calculate lighting model coefficients
        function calculateLightCoefficients(normal, lightDirection) {
            let diffuse = Math.max(0, dot(normal, lightDirection));
            let specular = Math.pow(Math.max(0, dot(cross(normal, lightDirection), normalize(lightDirection))), 24);
            return ambient() + diffuse * 0.85 + specular * 0.20;
        }

        // Function to render triangles
        function renderTriangles(triangles, vertices, colors) {
            for (let triangle of triangles) {
                let vert0 = vertices[triangle[0]];
                let vert1 = vertices[triangle[1]];
                let vert2 = vertices[triangle[2]];

                let minX = Math.max(0, Math.floor(Math.min(vert0.x, vert1.x, vert2.x)));
                let maxX = Math.min(canvas.width - 1, Math.ceil(Math.max(vert0.x, vert1.x, vert2.x)));
                let minY = Math.max(0, Math.floor(Math.min(vert0.y, vert1.y, vert2.y)));
                let maxY = Math.min(canvas.height - 1, Math.ceil(Math.max(vert0.y, vert1.y, vert2.y)));

                for (let y = minY; y <= maxY; y++) {
                    for (let x = minX; x <= maxX; x++) {
                        let pixelIndex = x + y * canvas.width;

                        let vertexIndex = pixelIndex * 4;

                        let n0 = vertices[triangle[0]];
                        let n1 = vertices[triangle[1]];
                        let n2 = vertices[triangle[2]];

                        let w0 = edge(vert1, vert2, {x: n1.x - n0.x, y: n1.y - n0.y, z: n1.z - n0.z}) / edge(vert0, vert1, {x: n0.x - n1.x, y: n0.y - n1.y, z: n0.z - n1.z});
                        let w1 = edge(vert2, vert0, {x: n2.x - n1.x, y: n2.y - n1.y, z: n2.z - n1.z}) / edge(vert0, vert2, {x: n0.x - n2.x, y: n0.y - n2.y, z: n0.z - n2.z});
                        let w2 = edge(vert0, vert1, {x: n0.x - n1.x, y: n0.y - n1.y, z: n0.z - n1.z}) / edge(vert0, vert1, {x: n1.x - n0.x, y: n1.y - n0.y, z: n1.z - n0.z});

                        if (w0 >= 0 && w1 >= 0 && w2 >= 0) {

                            let z = w0 * n0.z + w1 * n1.z + w2 * n2.z;
                            let depthValue = z < depth[pixelIndex] ? z : depth[pixelIndex];
                            depth[pixelIndex] = z;

                            let normal = normalize({x: w0 * n0.x + w1 * n1.x + w2 * n2.x, y: w0 * n0.y + w1 * n1.y + w2 * n2.y, z: w0 * n0.z + w1 * n1.z + w2 * n2.z});

                            let light = calculateLightCoefficients(normal, normalize(lightDir));

                            let colorIndex = pixelIndex * 4;
                            img.data[colorIndex] = Math.min(255, Math.round(color * light * 2));
                            img.data[colorIndex + 1] = Math.min(255, Math.round(color * light * 2));
                            img.data[colorIndex + 2] = Math.min(255, Math.round(color * light * 2));
                            img.data[colorIndex + 3] = 255;
                        }
                    }
                }
            }
        }

        // Event listener for keyboard input
        function handleKeyboardInput(event) {
            switch (event.code) {
                case 'ArrowLeft':
                    camYaw -= rot;
                    break;
                case 'ArrowRight':
                    camYaw += rot;
                    break;
                case 'Spacebar':
                    if (!jumping) {
                        velY = jump;
                        jumping = true;
                    } else {
                        velY = 0;
                        jumping = false;
                    }
                    break;
                default:
                    break;
            }
        }

        // Update the camera position based on user input
        function updateCameraPosition() {
            let mouseDeltaX = event.clientX - mouseX;
            let mouseDeltaY = event.clientY - mouseY;

            camPos.x += mouseDeltaX * speed;
            camPos.z += mouseDeltaY * speed;

            if (camPos.y < groundZ) {
                camPos.y = groundZ;
                velY = 0;
                jumping = false;
            }
        }

        // Initialize variables for rendering
        let mouseX = 0;
        let mouseY = 0;

        // Main rendering loop
        function mainLoop() {
            requestAnimationFrame(mainLoop);

            let currentTime = performance.now();
            let deltaTime = (currentTime - lastTime) / 1000;
            lastTime = currentTime;

            let speed = 5 * deltaTime;
            let rotationSpeed = 2 * deltaTime;

            let mouseMovement = {
                dx: 0,
                dy: 0
            };

            if (keys['ArrowLeft']) {
                mouseMovement.dx -= rotationSpeed;
            }
            if (keys['ArrowRight']) {
                mouseMovement.dx += rotationSpeed;
            }
            if (keys['ArrowUp']) {
                mouseMovement.dy += rotationSpeed;
            }
            if (keys['ArrowDown']) {
                mouseMovement.dy -= rotationSpeed;
            }

            camYaw += mouseMovement.dx;
            camPitch += mouseMovement.dy;

            let forward = vec3(Math.sin(camYaw), 0, Math.cos(camYaw));
            let right = vec3(Math.cos(camYaw), 0, -Math.sin(camYaw));

            camPos.x += forward.x * mouseMovement.dx + right.x * mouseMovement.dy;
            camPos.z += forward.z * mouseMovement.dx + right.z * mouseMovement.dy;

            img.data.fill(256);
            depth.fill(Number.MAX_VALUE);

            let objects = [
                { pos: vec3(0, 0, 5), color: 0xff4444 },
                { pos: vec3(4, 0, 8), color: 0x44ff44 }
            ];

            for (let object of objects) {
                for (let triangle of tris) {
                    let vertex0 = vertices[triangle[0]];
                    let vertex1 = vertices[triangle[1]];
                    let vertex2 = vertices[triangle[2]];

                    let vertexTransformed0 = rotateY(rotateX(camYaw), vertex0);
                    let vertexTransformed1 = rotateY(rotateX(camYaw), vertex1);
                    let vertexTransformed2 = rotateY(rotateX(camYaw), vertex2);

                    let transformedVertex0 = { x: vertexTransformed0.x, y: vertexTransformed0.y, z: vertexTransformed0.z };
                    let transformedVertex1 = { x: vertexTransformed1.x, y: vertexTransformed1.y, z: vertexTransformed1.z };
                    let transformedVertex2 = { x: vertexTransformed2.x, y: vertexTransformed2.y, z: vertexTransformed2.z };

                    if (transformedVertex0.z < 0.01 || transformedVertex1.z < 0.01 || transformedVertex2.z < 0.01) continue;

                    let normal0 = normalize(transformedVertex0);
                    let normal1 = normalize(transformedVertex1);
                    let normal2 = normalize(transformedVertex2);

                    let s0 = toScreen(project(transformedVertex0));
                    let s1 = toScreen(project(transformedVertex1));
                    let s2 = toScreen(project(transformedVertex2));

                    renderTriangles([s0, s1, s2], vertices, colors);
                }
            }

            ctx.putImageData(img, 0, 0);
        }

        // Start the main loop
        mainLoop();
    </script>
</body>
</html>
