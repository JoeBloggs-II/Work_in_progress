<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>CPU 3D Engine</title>
<style>
  body { margin:0; background:black; overflow:hidden; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

const W = canvas.width;
const H = canvas.height;

// Buffers
let img = ctx.createImageData(W, H);
let depth = new Float32Array(W * H);

// ======================
// Math
// ======================
function vec3(x,y,z){ return {x,y,z}; }

function add(a,b){ return vec3(a.x+b.x,a.y+b.y,a.z+b.z); }
function sub(a,b){ return vec3(a.x-b.x,a.y-b.y,a.z-b.z); }
function dot(a,b){ return a.x*b.x + a.y*b.y + a.z*b.z; }

function cross(a,b){
  return vec3(
    a.y*b.z - a.z*b.y,
    a.z*b.x - a.x*b.z,
    a.x*b.y - a.y*b.x
  );
}

function norm(v){
  let l = Math.hypot(v.x,v.y,v.z);
  return vec3(v.x/l,v.y/l,v.z/l);
}

// ======================
// Camera
// ======================
let camPos = vec3(0, 0, 0);
let camYaw = 0;
let camPitch = 0;

const keys = {};
addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

// ======================
// Projection
// ======================
const fov = 90;
const aspect = W/H;
const f = 1 / Math.tan((fov/2)*Math.PI/180);

function project(v){
  let z = Math.max(v.z, 0.1);
  return {
    x: (v.x * f / aspect) / z,
    y: (v.y * f) / z,
    z: z
  };
}

function toScreen(v){
  return {
    x: (v.x + 1) * 0.5 * W,
    y: (1 - (v.y + 1)*0.5) * H,
    z: v.z
  };
}

// ======================
// Cube
// ======================
const verts = [
  vec3(-1,-1,-1), vec3(1,-1,-1),
  vec3(1,1,-1), vec3(-1,1,-1),
  vec3(-1,-1,1), vec3(1,-1,1),
  vec3(1,1,1), vec3(-1,1,1)
];

const tris = [
  [0,3,2],[0,2,1],
  [4,5,6],[4,6,7],
  [0,1,5],[0,5,4],
  [2,3,7],[2,7,6],
  [1,2,6],[1,6,5],
  [0,4,7],[0,7,3]
];

// ======================
// Rasterizer
// ======================
function edge(a,b,c){
  return (c.x-a.x)*(b.y-a.y) - (c.y-a.y)*(b.x-a.x);
}

function drawTri(v0,v1,v2, brightness){
  let minX = Math.max(0, Math.floor(Math.min(v0.x,v1.x,v2.x)));
  let maxX = Math.min(W-1, Math.ceil(Math.max(v0.x,v1.x,v2.x)));
  let minY = Math.max(0, Math.floor(Math.min(v0.y,v1.y,v2.y)));
  let maxY = Math.min(H-1, Math.ceil(Math.max(v0.y,v1.y,v2.y)));

  let area = edge(v0,v1,v2);
  if(area === 0) return;

  const eps = -0.0001;

  for(let y=minY; y<=maxY; y++){
    for(let x=minX; x<=maxX; x++){
      let p = {x,y};

      let w0 = edge(v1,v2,p);
      let w1 = edge(v2,v0,p);
      let w2 = edge(v0,v1,p);

      if(
        (w0>=eps && w1>=eps && w2>=eps) ||
        (w0<=-eps && w1<=-eps && w2<=-eps)
      ){
        w0/=area; w1/=area; w2/=area;

        let z = 1 / (v0.z*w0 + v1.z*w1 + v2.z*w2);
        let i = x + y*W;

        if(z > depth[i]){
          depth[i] = z;

          // tone + gamma
          let b = brightness / (brightness + 1);
          let c = Math.pow(b, 1/2.2) * 255;

          let idx = i*4;
          img.data[idx] = c;
          img.data[idx+1] = c;
          img.data[idx+2] = c;
          img.data[idx+3] = 255;
        }
      }
    }
  }
}

// ======================
// Rotation
// ======================
function rotateY(v, a){
  return vec3(
    v.x*Math.cos(a) - v.z*Math.sin(a),
    v.y,
    v.x*Math.sin(a) + v.z*Math.cos(a)
  );
}

function rotateX(v, a){
  return vec3(
    v.x,
    v.y*Math.cos(a) - v.z*Math.sin(a),
    v.y*Math.sin(a) + v.z*Math.cos(a)
  );
}

// ======================
// Lighting
// ======================
const lightDir = norm(vec3(1,1,-1));

// ======================
// Main Loop
// ======================
function loop(){
  // movement
  const speed = 0.08;
  const rotSpeed = 0.03;

  let forward = vec3(
    Math.sin(camYaw) * Math.cos(camPitch),
    Math.sin(camPitch),
    Math.cos(camYaw) * Math.cos(camPitch)
  );

  let right = vec3(
    Math.cos(camYaw),
    0,
    -Math.sin(camYaw)
  );

  if(keys["w"]) camPos = sub(camPos, vec3(forward.x*speed, forward.y*speed, forward.z*speed));
  if(keys["s"]) camPos = add(camPos, vec3(forward.x*speed, forward.y*speed, forward.z*speed));
  if(keys["a"]) camPos = add(camPos, vec3(right.x*speed, 0, right.z*speed));
  if(keys["d"]) camPos = sub(camPos, vec3(right.x*speed, 0, right.z*speed));

  if(keys["q"]) camPos.y += speed;
  if(keys["e"]) camPos.y -= speed;

  if(keys["arrowleft"]) camYaw += rotSpeed;
  if(keys["arrowright"]) camYaw -= rotSpeed;
  if(keys["arrowup"]) camPitch -= rotSpeed;
  if(keys["arrowdown"]) camPitch += rotSpeed;

  camPitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, camPitch));

  // clear
  img.data.fill(0);
  depth.fill(-Infinity);

  // transform vertices
  let transformed = verts.map(v=>{
    let r = vec3(v.x, v.y, v.z);

    // push cube forward
    r.z += 5;

    // camera transform
    r = sub(r, camPos);
    r = rotateY(r, -camYaw);
    r = rotateX(r, -camPitch);

    return r;
  });

  for(let tri of tris){
    let v0 = transformed[tri[0]];
    let v1 = transformed[tri[1]];
    let v2 = transformed[tri[2]];

    let n = norm(cross(sub(v1,v0), sub(v2,v0)));

    // backface culling
    if(dot(n, v0) >= 0) continue;

    // lighting
    let diffuse = Math.max(0, dot(n, lightDir));
    let ambient = 0.15;
    let brightness = ambient + diffuse * 0.85;

    let p0 = toScreen(project(v0));
    let p1 = toScreen(project(v1));
    let p2 = toScreen(project(v2));

    drawTri(p0,p1,p2, brightness);
  }

  ctx.putImageData(img,0,0);
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
