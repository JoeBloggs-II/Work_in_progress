<canvas id="c" width="200" height="200"></canvas>

<script>
const W = 200, H = 200;
const N = 60;

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

let pos = new Float32Array(N*2);
let col = new Float32Array(N*3);
let sigma = new Float32Array(N);
let alpha = new Float32Array(N);

// ---------------- init ----------------
for (let i = 0; i < N; i++) {
  pos[i*2] = Math.random()*W;
  pos[i*2+1] = Math.random()*H;

  col[i*3] = Math.random();
  col[i*3+1] = Math.random();
  col[i*3+2] = Math.random();

  sigma[i] = 10 + Math.random()*10;
  alpha[i] = 0.6;
}

// ---------------- TARGET IMAGE ----------------
// example: coloured circle (RGB gradient)
function target(x,y){
  const dx = x-100;
  const dy = y-100;
  const d = Math.sqrt(dx*dx+dy*dy);

  if(d < 60){
    return [
      1.0,
      d/60,
      1.0 - d/60
    ];
  }

  return [0,0,0];
}

// ---------------- render single pixel ----------------
function renderPixel(x,y){
  let r=0,g=0,b=0;

  for(let i=0;i<N;i++){
    const dx = x-pos[i*2];
    const dy = y-pos[i*2+1];

    const d2 = dx*dx+dy*dy;
    const s = sigma[i];

    const w = Math.exp(-d2/(2*s*s))*alpha[i];

    r += w*col[i*3];
    g += w*col[i*3+1];
    b += w*col[i*3+2];
  }

  return [r,g,b];
}

// ---------------- TRAIN STEP (FAST) ----------------
function train(){
  // sample ONLY a few pixels per step
  for(let t=0;t<5;t++){

    const x = (Math.random()*W)|0;
    const y = (Math.random()*H)|0;

    const [tr,tg,tb] = target(x,y);
    let [cr,cg,cb] = renderPixel(x,y);

    const er = tr-cr;
    const eg = tg-cg;
    const eb = tb-cb;

    // pick a nearby splat to adjust
    const i = (Math.random()*N)|0;

    const dx = x - pos[i*2];
    const dy = y - pos[i*2+1];
    const influence = Math.exp(-(dx*dx+dy*dy)/(2*sigma[i]*sigma[i]));

    const lr = 0.01 * influence;

    // 🎯 POSITION update (pull toward error)
    pos[i*2]   += dx * (er+eg+eb) * lr;
    pos[i*2+1] += dy * (er+eg+eb) * lr;

    // 🎨 COLOUR update (THIS FIXES YOUR ISSUE)
    col[i*3]   += er * lr;
    col[i*3+1] += eg * lr;
    col[i*3+2] += eb * lr;

    // clamp colour
    col[i*3]   = Math.max(0,Math.min(1,col[i*3]));
    col[i*3+1] = Math.max(0,Math.min(1,col[i*3+1]));
    col[i*3+2] = Math.max(0,Math.min(1,col[i*3+2]));
  }
}

// ---------------- FULL RENDER ----------------
function draw(){
  const img = ctx.createImageData(W,H);

  for(let y=0;y<H;y++){
    for(let x=0;x<W;x++){

      const [r,g,b] = renderPixel(x,y);

      const i = (y*W+x)*4;
      img.data[i] = Math.min(255,r*255);
      img.data[i+1] = Math.min(255,g*255);
      img.data[i+2] = Math.min(255,b*255);
      img.data[i+3] = 255;
    }
  }

  ctx.putImageData(img,0,0);
}

// ---------------- LOOP ----------------
function loop(){
  train();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
