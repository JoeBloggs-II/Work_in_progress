<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>3D Water Simulation</title>
<style>
body{margin:0;overflow:hidden;background:#000;}
canvas{display:block;}
</style>
</head>

<body>
<canvas id="c"></canvas>

<script>

const canvas = document.getElementById("c")
const gl = canvas.getContext("webgl")

canvas.width = innerWidth
canvas.height = innerHeight

function shader(type,src){
 const s=gl.createShader(type)
 gl.shaderSource(s,src)
 gl.compileShader(s)
 return s
}

function program(v,f){
 const p=gl.createProgram()
 gl.attachShader(p,shader(gl.VERTEX_SHADER,v))
 gl.attachShader(p,shader(gl.FRAGMENT_SHADER,f))
 gl.linkProgram(p)
 return p
}

const vertex=`
attribute vec2 p;
varying vec2 uv;

void main(){
uv=p*0.5+0.5;
gl_Position=vec4(p,0,1);
}
`

const simFrag=`
precision highp float;

uniform sampler2D prev;
uniform vec2 res;
uniform vec2 ball;

varying vec2 uv;

void main(){

vec2 t=1.0/res;

float h=texture2D(prev,uv).r;

float l=texture2D(prev,uv-vec2(t.x,0)).r;
float r=texture2D(prev,uv+vec2(t.x,0)).r;
float u=texture2D(prev,uv+vec2(0,t.y)).r;
float d=texture2D(prev,uv-vec2(0,t.y)).r;

float lap=(l+r+u+d-4.0*h);

float newH=h+lap*0.5;

float dist=distance(uv,ball);

if(dist<0.05){
 newH+=0.02*(0.05-dist);
}

gl_FragColor=vec4(newH,0,0,1);
}
`

const renderFrag=`
precision highp float;

uniform sampler2D height;
uniform vec2 res;

varying vec2 uv;

void main(){

vec2 t=1.0/res;

float h=texture2D(height,uv).r;

float hx=texture2D(height,uv+vec2(t.x,0)).r-h;
float hy=texture2D(height,uv+vec2(0,t.y)).r-h;

vec3 normal=normalize(vec3(-hx*20.0,-hy*20.0,1.0));

vec3 light=normalize(vec3(0.4,0.3,1.0));

float diffuse=max(dot(normal,light),0.0);

vec3 color=vec3(0.0,0.35,0.7)*diffuse;

color+=pow(diffuse,40.0);

gl_FragColor=vec4(color,1);
}
`

const simProg=program(vertex,simFrag)
const drawProg=program(vertex,renderFrag)

const quad=gl.createBuffer()
gl.bindBuffer(gl.ARRAY_BUFFER,quad)
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([
-1,-1,1,-1,-1,1,1,1
]),gl.STATIC_DRAW)

function texture(){
 const t=gl.createTexture()
 gl.bindTexture(gl.TEXTURE_2D,t)
 gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,512,512,0,gl.RGBA,gl.UNSIGNED_BYTE,null)
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR)
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR)
 return t
}

function fbo(tex){
 const f=gl.createFramebuffer()
 gl.bindFramebuffer(gl.FRAMEBUFFER,f)
 gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex,0)
 return f
}

let texA=texture()
let texB=texture()

let fboA=fbo(texA)
let fboB=fbo(texB)

let ball={x:0.5,y:0.5}

canvas.onmousemove=e=>{
 ball.x=e.clientX/canvas.width
 ball.y=1-e.clientY/canvas.height
}

function draw(){

 gl.viewport(0,0,512,512)

 gl.useProgram(simProg)
 gl.bindFramebuffer(gl.FRAMEBUFFER,fboB)

 gl.bindBuffer(gl.ARRAY_BUFFER,quad)

 let loc=gl.getAttribLocation(simProg,"p")
 gl.enableVertexAttribArray(loc)
 gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0)

 gl.activeTexture(gl.TEXTURE0)
 gl.bindTexture(gl.TEXTURE_2D,texA)

 gl.uniform1i(gl.getUniformLocation(simProg,"prev"),0)
 gl.uniform2f(gl.getUniformLocation(simProg,"res"),512,512)
 gl.uniform2f(gl.getUniformLocation(simProg,"ball"),ball.x,ball.y)

 gl.drawArrays(gl.TRIANGLE_STRIP,0,4)

 ;[texA,texB]=[texB,texA]
 ;[fboA,fboB]=[fboB,fboA]

 gl.bindFramebuffer(gl.FRAMEBUFFER,null)

 gl.viewport(0,0,canvas.width,canvas.height)

 gl.useProgram(drawProg)

 let loc2=gl.getAttribLocation(drawProg,"p")
 gl.enableVertexAttribArray(loc2)
 gl.vertexAttribPointer(loc2,2,gl.FLOAT,false,0,0)

 gl.activeTexture(gl.TEXTURE0)
 gl.bindTexture(gl.TEXTURE_2D,texA)

 gl.uniform1i(gl.getUniformLocation(drawProg,"height"),0)
 gl.uniform2f(gl.getUniformLocation(drawProg,"res"),512,512)

 gl.drawArrays(gl.TRIANGLE_STRIP,0,4)

 requestAnimationFrame(draw)
}

draw()

</script>
</body>
</html>
