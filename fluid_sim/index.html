<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Fluid Simulation</title>
<style>
body {margin:0;overflow:hidden;background:black;}
canvas {display:block;}
</style>
</head>
<body>

<canvas id="c"></canvas>

<script>

const canvas = document.getElementById("c");
const gl = canvas.getContext("webgl");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

if(!gl){
    alert("WebGL not supported");
}

function compile(type,source){
    const s = gl.createShader(type);
    gl.shaderSource(s,source);
    gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){
        console.error(gl.getShaderInfoLog(s));
    }
    return s;
}

function createProgram(v,f){
    const p = gl.createProgram();
    gl.attachShader(p,compile(gl.VERTEX_SHADER,v));
    gl.attachShader(p,compile(gl.FRAGMENT_SHADER,f));
    gl.linkProgram(p);
    if(!gl.getProgramParameter(p,gl.LINK_STATUS)){
        console.error(gl.getProgramInfoLog(p));
    }
    return p;
}

const vertex = `
attribute vec2 pos;
varying vec2 uv;

void main(){
    uv = pos*0.5+0.5;
    gl_Position = vec4(pos,0,1);
}
`;

const fragment = `
precision mediump float;

varying vec2 uv;

uniform float time;
uniform vec2 ball;

void main(){

    float d = distance(uv,ball);

    float waves =
        sin(uv.x*20.0 + time*2.0) +
        sin(uv.y*25.0 + time*1.5);

    float ripple = sin(d*60.0 - time*6.0);

    float height = waves*0.03 + ripple*0.05/(1.0+d*20.0);

    vec3 water = vec3(0.1,0.3,0.8) + height;

    gl_FragColor = vec4(water,1.0);
}
`;

const prog = createProgram(vertex,fragment);
gl.useProgram(prog);

const quad = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,quad);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([
-1,-1,
1,-1,
-1,1,
1,1
]),gl.STATIC_DRAW);

const posLoc = gl.getAttribLocation(prog,"pos");
gl.enableVertexAttribArray(posLoc);
gl.vertexAttribPointer(posLoc,2,gl.FLOAT,false,0,0);

let ball = {x:0.5,y:0.5};

canvas.addEventListener("mousemove",e=>{
    ball.x = e.clientX/canvas.width;
    ball.y = 1-e.clientY/canvas.height;
});

function draw(t){

    gl.viewport(0,0,canvas.width,canvas.height);

    gl.uniform1f(gl.getUniformLocation(prog,"time"),t*0.001);
    gl.uniform2f(gl.getUniformLocation(prog,"ball"),ball.x,ball.y);

    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);

    requestAnimationFrame(draw);
}

requestAnimationFrame(draw);

</script>

</body>
</html>
