<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Water Box Simulation</title>

<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="https://cdn.babylonjs.com/materialsLibrary/babylon.waterMaterial.min.js"></script>

<style>
html,body{
width:100%;
height:100%;
margin:0;
overflow:hidden;
}
canvas{
width:100%;
height:100%;
touch-action:none;
}
</style>
</head>

<body>

<canvas id="renderCanvas"></canvas>

<script>

const canvas = document.getElementById("renderCanvas");
const engine = new BABYLON.Engine(canvas,true);

const createScene = function(){

const scene = new BABYLON.Scene(engine);

scene.clearColor = new BABYLON.Color4(0.7,0.85,1,1);

const camera = new BABYLON.ArcRotateCamera(
"cam",
-Math.PI/2,
Math.PI/3,
8,
new BABYLON.Vector3(0,0,0),
scene
);

camera.attachControl(canvas,true);

const light = new BABYLON.HemisphericLight(
"light",
new BABYLON.Vector3(1,1,0),
scene
);

light.intensity = 0.9;



// GLASS BOX

const box = BABYLON.MeshBuilder.CreateBox("box",{
size:6
},scene);

box.scaling.y = 3;

const glass = new BABYLON.StandardMaterial("glass",scene);
glass.alpha = 0.25;
glass.diffuseColor = new BABYLON.Color3(0.8,0.9,1);
box.material = glass;



// WATER SURFACE

const waterMesh = BABYLON.MeshBuilder.CreateGround(
"water",
{width:5.8,height:5.8,subdivisions:128},
scene
);

waterMesh.position.y = 0.3;

const water = new BABYLON.WaterMaterial(
"water",
scene,
new BABYLON.Vector2(1024,1024)
);

water.bumpTexture = new BABYLON.Texture(
"https://assets.babylonjs.com/environments/waterbump.png",
scene
);

water.windForce = 5;
water.waveHeight = 0.2;
water.bumpHeight = 0.1;
water.waveLength = 0.1;

waterMesh.material = water;



// FLOATING BALL

const ball = BABYLON.MeshBuilder.CreateSphere(
"ball",
{diameter:0.6},
scene
);

ball.position.y = 1;

const ballMat = new BABYLON.StandardMaterial("b",scene);
ballMat.diffuseColor = new BABYLON.Color3(1,0.4,0.3);
ball.material = ballMat;



// SIMPLE BUOYANCY

scene.onBeforeRenderObservable.add(()=>{

let waterLevel = waterMesh.position.y;

let depth = waterLevel - ball.position.y;

if(depth > -0.3){

ball.position.y += depth*0.05;

}

});



// CLICK TO PUSH BALL

scene.onPointerObservable.add((evt)=>{

if(evt.pickInfo.hit){

ball.position.x = evt.pickInfo.pickedPoint.x;
ball.position.z = evt.pickInfo.pickedPoint.z;

}

});

return scene;

};

const scene = createScene();

engine.runRenderLoop(()=>{

scene.render();

});

window.addEventListener("resize",()=>{

engine.resize();

});

</script>

</body>
</html>
